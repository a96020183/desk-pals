name: build
on: [push, workflow_dispatch]
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 測試絕不讀 runner 家目錄的 Claude／Codex 對話：整個 job 都指到空資料夾（桌面版離屏時本來就不看家目錄，這裡再保險一次）
      - name: Empty Claude / Codex folders for every test
        run: |
          mkdir -p "$RUNNER_TEMP/no-claude" "$RUNNER_TEMP/no-codex"
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/no-claude" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/no-codex" >> "$GITHUB_ENV"
      - name: DeskPals.swift is up to date with mac/src
        run: |
          python3 mac/assemble.py
          git diff --exit-code extension/desktop/DeskPals.swift
      # 公開版（上架、公開下載）：tools/variant.py 減掉同人角色 → build/public/extension，並掃一次同人字眼
      - name: Public variant (no fan-art lineups) + fan-content guard
        run: python3 -I tools/variant.py public
      - name: Compile personal (same command as desk-pals.sh)
        working-directory: extension/desktop
        run: |
          set -o pipefail
          xcrun swiftc -O DeskPals.swift -o DeskPals 2>&1 | tee build.log
      - name: Compile public
        working-directory: build/public/extension/desktop
        run: |
          set -o pipefail
          xcrun swiftc -O DeskPals.swift -o DeskPals 2>&1 | tee "$GITHUB_WORKSPACE/build-public.log"
          python3 -I "$GITHUB_WORKSPACE/tools/variant.py" guard DeskPals
      - name: Shell syntax
        run: |
          bash -n extension/desktop/desk-pals.sh
          bash -n packaging/mac/build_app.sh
      # ---------- 公開版：全新安裝 → 續命小隊、讀書小幫手、自己做的公仔（截圖放 mac-result）----------
      - name: Public smoke (fresh install → 續命小隊)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub"
          SOCK="$RUNNER_TEMP/dp-pub.sock"
          mkdir -p public-shots
          build/public/extension/desktop/DeskPals "$SOCK" "" "" > run-public.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-public.log; exit 1; }
          test "$(cat "$DESKPALS_DATA_DIR/lineup.txt" 2>/dev/null)" = "original" || { echo "fresh install did not start in original"; exit 1; }
          GITHUB_WORKSPACE="$PWD/public-shots" SMOKE_ENDPOINT="$SOCK" SMOKE_ORIGINAL=1 node .github/smoke.js
          sleep 3
          tail -n 60 "$HOME/Library/Logs/desk-pals.log" || true
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; exit 1; fi
          test -f public-shots/shot-original.png || { echo "no snapshot"; exit 1; }
      - name: Public study helper test (ICS fixtures, fake clock, TZ=Asia/Taipei)
        run: |
          export TZ=Asia/Taipei DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-study"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"
          SOCK="$RUNNER_TEMP/dp-pub-study.sock"
          build/public/extension/desktop/DeskPals "$SOCK" duoduo original > run-public-study.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-public-study.log; exit 1; }
          set +e
          STUDY_PET=duoduo node test/desktop-study.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/study"
          RC=$?
          set -e
          kill -0 $PID 2>/dev/null || { echo "app died during the test"; cat run-public-study.log; exit 1; }
          kill $PID || true
          exit $RC
      - name: Public custom pal flow (generated test image → maker → share GIF, .deskpal)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-custom"
          SOCK="$RUNNER_TEMP/dp-pub-custom.sock"
          build/public/extension/desktop/DeskPals "$SOCK" "" "" > run-public-custom.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-public-custom.log; exit 1; }
          set +e
          node .github/custom-smoke.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/custom"
          RC=$?
          set -e
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; RC=1; fi
          exit $RC
      # 搗蛋四個玩法：離屏模式一定用假的游標／視窗／按鍵計數（MisFake），不會動到 runner 的滑鼠
      - name: Public mischief test (grab cursor, clear at off-work, shopping police, typing; fake side effects)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-mis"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"
          SOCK="$RUNNER_TEMP/dp-pub-mis.sock"
          build/public/extension/desktop/DeskPals "$SOCK" duoduo original > run-public-mischief.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-public-mischief.log; exit 1; }
          set +e
          node test/desktop-mischief.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/mischief" "$HOME/Library/Logs/desk-pals.log"
          RC=$?
          set -e
          grep -E "mischief" "$HOME/Library/Logs/desk-pals.log" | tail -n 40 || true
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "::error::public mischief: desktop did not quit"; kill $PID; RC=1; fi
          exit $RC
      - name: Public squad test (續命小隊：圖、沒電的電量、舊資料轉給新三隻)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-squad"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"; printf original > "$DESKPALS_DATA_DIR/lineup.txt"
          printf 12 > "$DESKPALS_DATA_DIR/bond-boba.txt"; printf 5 > "$DESKPALS_DATA_DIR/bond-coffee.txt"; printf "boba coffee sticky" > "$DESKPALS_DATA_DIR/out-original.txt"
          SOCK="$RUNNER_TEMP/dp-pub-squad.sock"
          build/public/extension/desktop/DeskPals "$SOCK" "" "" > run-public-squad.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "::error::public squad: died at startup"; cat run-public-squad.log; exit 1; }
          set +e
          SQUAD_LEGACY=1 node test/desktop-squad.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/squad" "$DESKPALS_DATA_DIR"
          RC=$?
          set -e
          grep -E "squad|battery" "$HOME/Library/Logs/desk-pals.log" | tail -n 20 || true
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "::error::public squad: desktop did not quit"; kill $PID; RC=1; fi
          exit $RC
      # 紙箱櫃（pals/shelf）：圖讀得到、三隻在格子裡、名牌、第 4 格入口、晚上變暗、外出中、點格子、收合鈕
      - name: Public shelf test (紙箱櫃)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-shelf"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"; printf original > "$DESKPALS_DATA_DIR/lineup.txt"
          SOCK="$RUNNER_TEMP/dp-pub-shelf.sock"
          build/public/extension/desktop/DeskPals "$SOCK" duoduo original > run-public-shelf.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "::error::public shelf: died at startup"; cat run-public-shelf.log; exit 1; }
          set +e
          SHELF_LINEUP=original node test/desktop-shelf.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/shelf"
          RC=$?
          set -e
          grep -E "shelf" "$HOME/Library/Logs/desk-pals.log" | tail -n 20 || true
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "::error::public shelf: desktop did not quit"; kill $PID; RC=1; fi
          exit $RC
      # 窩伴小世界（翻翻・破破・綿綿）：全新安裝的設定第一頁（兩櫃二選一、選了只記在本機 log）、三隻 16 張動作圖、招牌動作、串場、換櫃、書包小屋
      - name: Public woban test (窩伴小世界：設定第一頁、動作圖、書包小屋)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          RC=0
          for MODE in setup pals; do
            export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-woban-$MODE"
            mkdir -p "$DESKPALS_DATA_DIR"
            SOCK="$RUNNER_TEMP/dp-pub-woban-$MODE.sock"
            if [ "$MODE" = pals ]; then
              printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"; printf woban > "$DESKPALS_DATA_DIR/lineup.txt"
              build/public/extension/desktop/DeskPals "$SOCK" fanfan woban > "run-public-woban-$MODE.log" 2>&1 &
            else
              build/public/extension/desktop/DeskPals "$SOCK" "" "" > "run-public-woban-$MODE.log" 2>&1 &
            fi
            PID=$!
            sleep 8
            kill -0 $PID || { echo "::error::public woban ($MODE): died at startup"; cat "run-public-woban-$MODE.log"; exit 1; }
            set +e
            WOBAN_MODE=$MODE node test/desktop-woban.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/woban" "$HOME/Library/Logs/desk-pals.log" || RC=1
            set -e
            sleep 2
            if kill -0 $PID 2>/dev/null; then echo "::error::public woban ($MODE): desktop did not quit"; kill $PID; RC=1; fi
          done
          grep -E "woban|setup:|shelf art|pal art" "$HOME/Library/Logs/desk-pals.log" | tail -n 30 || true
          exit $RC
      - name: Public shelf test (書包小屋)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-pub-shelf-woban"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"; printf woban > "$DESKPALS_DATA_DIR/lineup.txt"
          SOCK="$RUNNER_TEMP/dp-pub-shelf-woban.sock"
          build/public/extension/desktop/DeskPals "$SOCK" fanfan woban > run-public-shelf-woban.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "::error::public shelf (woban): died at startup"; cat run-public-shelf-woban.log; exit 1; }
          set +e
          SHELF_LINEUP=woban node test/desktop-shelf.js "$SOCK" "$GITHUB_WORKSPACE/public-shots/shelf-woban"
          RC=$?
          set -e
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "::error::public shelf (woban): desktop did not quit"; kill $PID; RC=1; fi
          exit $RC
      # ---------- 個人版（全部角色，含同人）：跟以前一樣的測試，截圖只放 personal-mac-result ----------
      - name: Personal smoke run (offscreen, all pets, snapshot, quit)
        run: |
          export DESKPALS_OFFSCREEN=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data"
          SOCK="$RUNNER_TEMP/dp.sock"
          extension/desktop/DeskPals "$SOCK" po classic > run.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run.log; exit 1; }
          SMOKE_ENDPOINT="$SOCK" node .github/smoke.js
          sleep 3
          cat "$HOME/Library/Logs/desk-pals.log" || true
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; exit 1; fi
          test -f shot.png || { echo "no snapshot"; exit 1; }
      - name: Smoke run, pikmin lineup (personal; screenshots only in the artifact)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-pik"
          SOCK="$RUNNER_TEMP/dp-pik.sock"
          extension/desktop/DeskPals "$SOCK" pkred pikmin > run-pikmin.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-pikmin.log; exit 1; }
          SMOKE_ENDPOINT="$SOCK" SMOKE_PIKMIN=1 node .github/smoke.js
          sleep 3
          tail -n 80 "$HOME/Library/Logs/desk-pals.log" || true
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; exit 1; fi
          test -f shot-pikmin.png || { echo "no snapshot"; exit 1; }
      - name: Personal shelf test, pikmin lineup (紙箱櫃＋大格的休息花; screenshots only in the personal artifact)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-shelf-pik"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"; printf pikmin > "$DESKPALS_DATA_DIR/lineup.txt"
          SOCK="$RUNNER_TEMP/dp-shelf-pik.sock"
          extension/desktop/DeskPals "$SOCK" pkred pikmin > run-shelf-pikmin.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "::error::personal shelf: died at startup"; cat run-shelf-pikmin.log; exit 1; }
          set +e
          SHELF_LINEUP=pikmin node test/desktop-shelf.js "$SOCK" "$GITHUB_WORKSPACE/shots-shelf"
          RC=$?
          set -e
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "::error::personal shelf: desktop did not quit"; kill $PID; RC=1; fi
          exit $RC

      - name: Personal smoke run, fresh install → 續命小隊 (original lineup default)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-orig"
          SOCK="$RUNNER_TEMP/dp-orig.sock"
          extension/desktop/DeskPals "$SOCK" "" "" > run-original.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-original.log; exit 1; }
          echo "lineup.txt: $(cat "$DESKPALS_DATA_DIR/lineup.txt" 2>/dev/null)"
          test "$(cat "$DESKPALS_DATA_DIR/lineup.txt" 2>/dev/null)" = "original" || { echo "fresh install did not start in original"; exit 1; }
          SMOKE_ENDPOINT="$SOCK" SMOKE_ORIGINAL=1 node .github/smoke.js
          sleep 3
          tail -n 80 "$HOME/Library/Logs/desk-pals.log" || true
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; exit 1; fi
          test -f shot-original.png || { echo "no snapshot"; exit 1; }
      - name: Personal study helper desktop test (ICS fixtures, fake clock, TZ=Asia/Taipei)
        run: |
          export TZ=Asia/Taipei DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-study"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"
          SOCK="$RUNNER_TEMP/dp-study.sock"
          extension/desktop/DeskPals "$SOCK" spidey classic > run-study.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-study.log; exit 1; }
          set +e
          node test/desktop-study.js "$SOCK" "$GITHUB_WORKSPACE/shots-study"
          RC=$?
          set -e
          grep -E "school|deadline|exam|latenight|study" "$HOME/Library/Logs/desk-pals.log" | tail -n 60 || true
          kill -0 $PID 2>/dev/null || { echo "app died during the test"; cat run-study.log; exit 1; }
          kill $PID || true
          exit $RC
      - name: Personal custom pal flow (generated test image → maker → share GIF, .deskpal)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-custom"
          SOCK="$RUNNER_TEMP/dp-custom.sock"
          extension/desktop/DeskPals "$SOCK" "" "" > run-custom.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-custom.log; exit 1; }
          set +e
          node .github/custom-smoke.js "$SOCK" "$GITHUB_WORKSPACE/custom-out"
          RC=$?
          set -e
          grep -E "custom|share" "$HOME/Library/Logs/desk-pals.log" | tail -n 60 || true
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; RC=1; fi
          exit $RC
      - name: Personal mischief test (fake side effects)
        run: |
          export DESKPALS_OFFSCREEN=1 DESKPALS_ISOLATED=1
          export DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-mis"
          mkdir -p "$DESKPALS_DATA_DIR"
          printf done > "$DESKPALS_DATA_DIR/profile.txt"; printf shelf > "$DESKPALS_DATA_DIR/mode.txt"
          SOCK="$RUNNER_TEMP/dp-mis.sock"
          extension/desktop/DeskPals "$SOCK" duoduo original > run-mischief.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "::error::personal mischief: died at startup"; cat run-mischief.log; exit 1; }
          set +e
          node test/desktop-mischief.js "$SOCK" "$GITHUB_WORKSPACE/shots-mischief" "$HOME/Library/Logs/desk-pals.log"
          RC=$?
          set -e
          grep -E "mischief" "$HOME/Library/Logs/desk-pals.log" | tail -n 40 || true
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "::error::personal mischief: desktop did not quit"; kill $PID; RC=1; fi
          exit $RC
      # ---------- 舊版「Spidey 小夥伴」升級接手（個人版）＋全新安裝不會建出舊名字的東西：都在臨時資料夾，不碰 runner 的家目錄 ----------
      - name: Legacy upgrade takeover (personal) + fresh installs create nothing old (personal, public)
        run: |
          T="$RUNNER_TEMP/lg"
          mkdir -p "$T"
          node .github/legacy-upgrade.js upgrade "$T/a.sock" "$T/SpideyDesktop" "$T/LaunchAgents" "$T/data" - -- extension/desktop/DeskPals "$T/a.sock" "" ""
          node .github/legacy-upgrade.js fresh "$T/b.sock" "$T/none-b" "$T/LaunchAgents-b" "$T/data-b" - -- extension/desktop/DeskPals "$T/b.sock" "" ""
          node .github/legacy-upgrade.js fresh "$T/c.sock" "$T/none-c" "$T/LaunchAgents-c" "$T/data-c" - -- build/public/extension/desktop/DeskPals "$T/c.sock" "" ""
      # ---------- 上架前：匿名回報（只送到本機假端點）、搗蛋預設關＋第一次打開的說明、舊使用者轉換（公開版＋個人版）----------
      - name: Store readiness (anonymous stats to a local fake endpoint, mischief consent; public + personal)
        run: |
          mkdir -p public-shots/store
          node test/desktop-store.js "$RUNNER_TEMP/dps" "$RUNNER_TEMP/dps-pub" public-shots/store public mac -- build/public/extension/desktop/DeskPals {ep} "" ""
          node test/desktop-store.js "$RUNNER_TEMP/dpsp" "$RUNNER_TEMP/dps-per" "$RUNNER_TEMP/dps-per-shots" personal mac -- extension/desktop/DeskPals {ep} "" ""
      # 公仔櫃收起來（小紙箱）：沒有 mode.txt＝整櫃、存過 mode.txt 的照舊、左鍵點小紙箱（整櫃＝打開櫃子；只要一隻＝叫他出來＋第一次說明）
      - name: Egg test (shelf by default, left-click the collapsed box; public + personal)
        run: |
          mkdir -p public-shots/egg
          node test/desktop-egg.js "$RUNNER_TEMP/dpe" "$RUNNER_TEMP/dpe-pub" public-shots/egg -- build/public/extension/desktop/DeskPals {ep} duoduo original
          node test/desktop-egg.js "$RUNNER_TEMP/dpep" "$RUNNER_TEMP/dpe-per" "$RUNNER_TEMP/dpe-per-shots" -- extension/desktop/DeskPals {ep} duoduo original
      # ---------- 0.11 工作來源、工作設定、小本子（跟 Windows 同三支測試；假的 Jira／行事曆／天氣、假的 glab／gh、不連網路；Jira token 在測試專用的鑰匙圈項目）----------
      - name: Work sources + work settings + notebook tests (public + personal; TZ=Asia/Taipei like the Windows runner)
        env:
          TZ: Asia/Taipei
        run: |
          mkdir -p public-shots/work public-shots/work-settings public-shots/notebook
          RC=0
          node test/desktop-work.js "$RUNNER_TEMP/dpw" "$RUNNER_TEMP/dpw-pub" public-shots/work -- build/public/extension/desktop/DeskPals {ep} "" "" || { echo "::error::work sources test failed (public)"; RC=1; }
          node test/desktop-work.js "$RUNNER_TEMP/dpwp" "$RUNNER_TEMP/dpw-per" "$RUNNER_TEMP/dpw-per-shots" -- extension/desktop/DeskPals {ep} "" "" || { echo "::error::work sources test failed (personal)"; RC=1; }
          node test/desktop-worksettings.js "$RUNNER_TEMP/dpws" "$RUNNER_TEMP/dpws-pub" public-shots/work-settings -- build/public/extension/desktop/DeskPals {ep} duoduo original || { echo "::error::work settings test failed (public)"; RC=1; }
          node test/desktop-worksettings.js "$RUNNER_TEMP/dpwsp" "$RUNNER_TEMP/dpws-per" "$RUNNER_TEMP/dpws-per-shots" -- extension/desktop/DeskPals {ep} duoduo original || { echo "::error::work settings test failed (personal)"; RC=1; }
          node test/desktop-notebook.js "$RUNNER_TEMP/dpn" "$RUNNER_TEMP/dp-nb-pub" public-shots/notebook -- build/public/extension/desktop/DeskPals {ep} duoduo original || { echo "::error::notebook test failed (public)"; RC=1; }
          NB_SHOTS=0 node test/desktop-notebook.js "$RUNNER_TEMP/dpnp" "$RUNNER_TEMP/dp-nb-per" "$RUNNER_TEMP/dp-nb-per-shots" -- extension/desktop/DeskPals {ep} duoduo original || { echo "::error::notebook test failed (personal)"; RC=1; }
          tail -n 80 "$HOME/Library/Logs/desk-pals.log" || true
          exit $RC
      # ---------- standalone WoWo Pals.app / DMG ----------
      - name: Developer ID certificate (only if the secrets exist)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then echo "no Developer ID secret: ad-hoc signed build"; exit 0; fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$ID" ] || { echo "no 'Developer ID Application' identity in the .p12"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build WoWo Pals.app + DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MAC_BUNDLE_ID: ${{ vars.MAC_BUNDLE_ID }}
          # 匿名回報（公開版）：沒設＝這個 .app 不回報
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          [ -n "$MAC_BUNDLE_ID" ] || unset MAC_BUNDLE_ID
          PYTHON="$RUNNER_TEMP/venv/bin/python" packaging/mac/build_app.sh dist
      - name: Check the DMG and smoke-test the bundled universal binary
        run: |
          set -e
          DMG="$(ls dist/DeskPals-*.dmg)"
          MNT="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          python3 -I tools/variant.py guard "$MNT"   # 公開版 DMG：裡面（執行檔、資源、說明）不能有同人字眼
          test -L "$MNT/Applications"
          codesign --verify --strict --verbose=2 "$MNT/WoWo Pals.app"
          rm -rf "$RUNNER_TEMP/apps" && mkdir -p "$RUNNER_TEMP/apps" && cp -R "$MNT/WoWo Pals.app" "$RUNNER_TEMP/apps/"
          hdiutil detach "$MNT"
          APP="$RUNNER_TEMP/apps/WoWo Pals.app"
          BIN="$APP/Contents/MacOS/DeskPals"
          lipo -archs "$BIN" | grep -q arm64 && lipo -archs "$BIN" | grep -q x86_64
          plutil -p "$APP/Contents/Info.plist"
          # offscreen: same public smoke as above (fresh install → 續命小隊), with the bundled binary
          export DESKPALS_OFFSCREEN=1 DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-data-app"
          SOCK="$RUNNER_TEMP/dp-app.sock"
          "$BIN" "$SOCK" duoduo original > run-app.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run-app.log; exit 1; }
          mkdir -p app-shots && (cd app-shots && GITHUB_WORKSPACE="$PWD" SMOKE_ENDPOINT="$SOCK" SMOKE_ORIGINAL=1 node ../.github/smoke.js)
          sleep 3
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; exit 1; fi
          test -f app-shots/shot-original.png
      - name: Standalone app takes over from the extension (marker, LaunchAgent, single instance)
        run: |
          set -e
          APP="$RUNNER_TEMP/apps/WoWo Pals.app"
          BIN="$APP/Contents/MacOS/DeskPals"
          HOME_DIR="$HOME/Library/Application Support/DeskPals"
          SOCK="$HOME_DIR/desk-pals.sock"
          PLIST="$HOME/Library/LaunchAgents/local.desk-pals.plist"
          mkdir -p "$HOME/Library/LaunchAgents" "$HOME_DIR"
          # what the VS Code extension leaves behind: LaunchAgent → desk-pals.sh, its own compiled copy running on the same socket
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>Label</key><string>local.desk-pals</string><key>ProgramArguments</key><array><string>/bin/bash</string><string>%s/desk-pals.sh</string></array></dict></plist>\n' "$HOME_DIR" > "$PLIST"
          DESKPALS_OFFSCREEN=1 DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-ext" extension/desktop/DeskPals "$SOCK" duoduo original > run-ext.log 2>&1 &
          EXT=$!
          node .github/ping.js "$SOCK"
          # open the .app (not offscreen: this is the real first launch path; the runner has no user to bother)
          DESKPALS_DATA_DIR="$RUNNER_TEMP/dp-std" "$BIN" > run-std.log 2>&1 &
          STD=$!
          sleep 10
          if kill -0 $EXT 2>/dev/null; then echo "extension copy was not replaced"; exit 1; fi
          kill -0 $STD || { echo "app died"; cat run-std.log; tail -40 "$HOME/Library/Logs/desk-pals.log"; exit 1; }
          cat "$HOME_DIR/standalone.json"; echo
          grep -q '"kind":"app"' "$HOME_DIR/standalone.json"
          cat "$PLIST"
          grep -q "$BIN" "$PLIST"
          ! grep -q desk-pals.sh "$PLIST"
          cmp "$HOME_DIR/claude-hook.js" build/public/extension/desktop/claude-hook.js
          node .github/ping.js "$SOCK"
          # second launch: says hi to the running one and exits
          "$BIN"; echo "second launch exit $?"
          kill -0 $STD
          node .github/ping.js "$SOCK" quit
          sleep 3
          if kill -0 $STD 2>/dev/null; then echo "did not quit"; kill $STD; exit 1; fi
          # 全新安裝（這台 runner 沒有舊版）：不能建出舊名字的資料夾、LaunchAgent、紀錄檔
          if ls -d "$HOME/Library/Application Support/"* "$HOME/Library/LaunchAgents/"* "$HOME/Library/Logs/"* "$HOME_DIR/"* | grep -i spidey; then echo "a fresh install created something with the old name"; exit 1; fi
          rm -f "$PLIST" "$HOME_DIR/standalone.json"
      # 公開版的測試結果（只有續命小隊、自己做的公仔）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-result
          path: |
            build-public.log
            run-public*.log
            run-app.log
            run-std.log
            public-shots/**
            app-shots/*.png
      # 個人版的測試結果（含同人角色的截圖）：只給自己看，不會附到 Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-mac-result
          path: |
            extension/desktop/build.log
            run.log
            run-pikmin.log
            run-original.log
            run-study.log
            run-custom.log
            run-mischief.log
            run-shelf-pikmin.log
            shot*.png
            shots-study/*.png
            shots-mischief/*.png
            shots-shelf/*.png
            custom-out/*.png
            custom-out/*.deskpal
            custom-out/share/*
      - uses: actions/upload-artifact@v4
        with:
          name: desk-pals-mac
          path: dist/DeskPals-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 測試絕不讀 runner 家目錄的 Claude／Codex 對話：整個 job 都指到空資料夾（桌面版離屏時本來就不看家目錄，這裡再保險一次）
      - name: Empty Claude / Codex folders for every test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\no-claude", "$env:RUNNER_TEMP\no-codex" | Out-Null
          [IO.File]::AppendAllText($env:GITHUB_ENV, "CLAUDE_CONFIG_DIR=$env:RUNNER_TEMP\no-claude`nCODEX_HOME=$env:RUNNER_TEMP\no-codex`n")   # 不帶 BOM
      - name: Compile personal DeskPals (same as desk-pals.ps1)
        shell: powershell
        run: |
          $src = [System.IO.File]::ReadAllText("extension\desktop\DeskPals.cs", [System.Text.Encoding]::UTF8)
          foreach ($f in (Get-ChildItem -Path "extension\desktop" -Filter "DeskPals.*.cs" | Sort-Object Name)) { $src += "`n" + [System.IO.File]::ReadAllText($f.FullName, [System.Text.Encoding]::UTF8) }
          Add-Type -TypeDefinition $src -ReferencedAssemblies System.Windows.Forms, System.Drawing, System.Web.Extensions -ErrorAction Stop
          "COMPILED OK"
      # 公開版（上架、公開下載）：tools/variant.py 減掉同人角色 → build\public\extension，並掃一次同人字眼
      - name: Public variant (no fan-art lineups) + fan-content guard, compile it
        shell: powershell
        run: |
          python -I tools/variant.py public
          if ($LASTEXITCODE -ne 0) { throw "public variant has fan content" }
          $d = "build\public\extension\desktop"
          $src = [System.IO.File]::ReadAllText("$d\DeskPals.cs", [System.Text.Encoding]::UTF8)
          foreach ($f in (Get-ChildItem -Path $d -Filter "DeskPals.*.cs" | Sort-Object Name)) { $src += "`n" + [System.IO.File]::ReadAllText($f.FullName, [System.Text.Encoding]::UTF8) }
          Add-Type -TypeDefinition $src -ReferencedAssemblies System.Windows.Forms, System.Drawing, System.Web.Extensions -ErrorAction Stop
          "PUBLIC COMPILED OK"
      - name: Personal smoke run (offscreen, all four pets, snapshot, quit)
        shell: powershell
        run: |
          $env:DESKPALS_OFFSCREEN = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-data"
          $ps1 = (Resolve-Path "extension\desktop\desk-pals.ps1").Path
          Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$ps1`" -PipeName desk-pals-ci -Pet po"
          Start-Sleep -Seconds 12
          node .github/smoke.js
          Start-Sleep -Seconds 3
          if (Test-Path "$env:TEMP\desk-pals.log") { Get-Content "$env:TEMP\desk-pals.log" }
          if (-not (Test-Path shot.png)) { throw "no snapshot" }
          New-Item -ItemType Directory -Force ps1-shots | Out-Null
          Move-Item shot*.png ps1-shots
      - name: Public smoke run, VS Code path (desk-pals.ps1, fresh install → 續命小隊)
        shell: powershell
        run: |
          $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-pub-ps1"
          $ps1 = (Resolve-Path "build\public\extension\desktop\desk-pals.ps1").Path
          Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$ps1`" -PipeName desk-pals-pubci"
          Start-Sleep -Seconds 12
          New-Item -ItemType Directory -Force public-ps1-shots | Out-Null
          $env:SMOKE_ENDPOINT = "\\.\pipe\desk-pals-pubci"; $env:SMOKE_ORIGINAL = "1"; $env:GITHUB_WORKSPACE = (Resolve-Path public-ps1-shots).Path
          node .github/smoke.js
          Start-Sleep -Seconds 3
          if ((Get-Content "$env:DESKPALS_DATA_DIR\lineup.txt") -ne "original") { throw "fresh install did not start in original" }
          if (-not (Test-Path public-ps1-shots\shot-original.png)) { throw "no snapshot" }
      # 搗蛋四個玩法（公開版＋個人版）：離屏模式一定用假的游標／視窗／按鍵計數（MisFake），不會動到 runner 的滑鼠、視窗、鍵盤
      - name: Mischief tests (public + personal, offscreen, fake side effects) + VS Code settings unit test + line keys
        shell: powershell
        run: |
          node --test test/mischief.test.js test/lines.test.js test/work-own.test.js
          if ($LASTEXITCODE -ne 0) { throw "mischief unit test failed" }
          $runs = @(@{ n = "pub"; ps1 = "build\public\extension\desktop\desk-pals.ps1"; out = "public-ps1-shots\mischief" }, @{ n = "per"; ps1 = "extension\desktop\desk-pals.ps1"; out = "ps1-shots\mischief" })
          foreach ($v in $runs) {
            $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
            $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-mis-" + $v.n
            New-Item -ItemType Directory -Force $env:DESKPALS_DATA_DIR | Out-Null
            Set-Content "$env:DESKPALS_DATA_DIR\profile.txt" "done" -NoNewline
            Set-Content "$env:DESKPALS_DATA_DIR\mode.txt" "shelf" -NoNewline
            $ps1 = (Resolve-Path $v.ps1).Path
            $pipe = "desk-pals-mis-" + $v.n
            Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$ps1`" -PipeName $pipe -Pet duoduo -Lineup original"
            node .github/ping.js $pipe
            if ($LASTEXITCODE -ne 0) { throw "desktop did not start (" + $v.n + ")" }
            New-Item -ItemType Directory -Force $v.out | Out-Null
            node test/desktop-mischief.js $pipe (Resolve-Path $v.out).Path "$env:TEMP\desk-pals.log"
            if ($LASTEXITCODE -ne 0) { throw "mischief test failed (" + $v.n + ")" }
          }
      # 上架前：匿名回報（只送到本機假端點）、搗蛋預設關＋第一次打開的說明、舊使用者轉換（公開版＋個人版，VS Code 的 desk-pals.ps1 路徑）
      - name: Store readiness (anonymous stats to a local fake endpoint, mischief consent; public + personal, desk-pals.ps1)
        shell: powershell
        run: |
          $pub = (Resolve-Path "build\public\extension\desktop\desk-pals.ps1").Path
          $per = (Resolve-Path "extension\desktop\desk-pals.ps1").Path
          New-Item -ItemType Directory -Force public-ps1-shots\store | Out-Null
          node test/desktop-store.js desk-pals-store "$env:RUNNER_TEMP\dps-pub" public-ps1-shots\store public win-vscode -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $pub -PipeName "{ep}"
          if ($LASTEXITCODE -ne 0) { throw "store test failed (public)" }
          node test/desktop-store.js desk-pals-storep "$env:RUNNER_TEMP\dps-per" "$env:RUNNER_TEMP\dps-per-shots" personal win-vscode -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $per -PipeName "{ep}"
          if ($LASTEXITCODE -ne 0) { throw "store test failed (personal)" }
      # 公仔櫃收起來（小紙箱）：沒有 mode.txt＝整櫃、存過 mode.txt 的照舊、左鍵點小紙箱（整櫃＝打開櫃子；只要一隻＝叫他出來＋第一次說明）
      - name: Egg test (shelf by default, left-click the collapsed box; public + personal, desk-pals.ps1)
        shell: powershell
        run: |
          $pub = (Resolve-Path "build\public\extension\desktop\desk-pals.ps1").Path
          $per = (Resolve-Path "extension\desktop\desk-pals.ps1").Path
          New-Item -ItemType Directory -Force public-ps1-shots\egg | Out-Null
          node test/desktop-egg.js desk-pals-egg "$env:RUNNER_TEMP\dpe-pub" public-ps1-shots\egg -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $pub -PipeName "{ep}" -Pet duoduo -Lineup original
          if ($LASTEXITCODE -ne 0) { throw "egg test failed (public)" }
          node test/desktop-egg.js desk-pals-eggp "$env:RUNNER_TEMP\dpe-per" "$env:RUNNER_TEMP\dpe-per-shots" -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $per -PipeName "{ep}" -Pet duoduo -Lineup original
          if ($LASTEXITCODE -ne 0) { throw "egg test failed (personal)" }
      # 續命小隊（躲躲、沒電、刺刺）：圖讀得到（VS Code 的 desk-pals.ps1 路徑）、沒電的液面跟 levels.json 一樣、電量改顏色、舊的像素版資料轉過去
      - name: Squad test (public, desk-pals.ps1)
        shell: powershell
        run: |
          $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-squad"
          New-Item -ItemType Directory -Force $env:DESKPALS_DATA_DIR | Out-Null
          Set-Content "$env:DESKPALS_DATA_DIR\profile.txt" "done" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\mode.txt" "shelf" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\lineup.txt" "original" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\bond-boba.txt" "12" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\bond-coffee.txt" "5" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\out-original.txt" "boba coffee sticky" -NoNewline
          $ps1 = (Resolve-Path "build\public\extension\desktop\desk-pals.ps1").Path
          Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$ps1`" -PipeName desk-pals-squad"
          node .github/ping.js desk-pals-squad
          if ($LASTEXITCODE -ne 0) { throw "desktop did not start (squad)" }
          New-Item -ItemType Directory -Force public-ps1-shots\squad | Out-Null
          $env:SQUAD_LEGACY = "1"
          node test/desktop-squad.js desk-pals-squad (Resolve-Path public-ps1-shots\squad).Path $env:DESKPALS_DATA_DIR
          if ($LASTEXITCODE -ne 0) { throw "squad test failed" }
      # 紙箱櫃（pals/shelf）：公開版續命小隊＋個人版皮克敏（大格休息花）。圖讀得到、三隻在格子裡、名牌、第 4 格入口、晚上、外出中、點格子、收合鈕
      - name: Shelf test (public original + personal pikmin, desk-pals.ps1)
        shell: powershell
        run: |
          $runs = @(@{ n = "pub"; ps1 = "build\public\extension\desktop\desk-pals.ps1"; lu = "original"; pet = "duoduo"; out = "public-ps1-shots\shelf" }, @{ n = "per"; ps1 = "extension\desktop\desk-pals.ps1"; lu = "pikmin"; pet = "pkred"; out = "ps1-shots\shelf" })
          foreach ($v in $runs) {
            $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
            $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-shelf-" + $v.n
            New-Item -ItemType Directory -Force $env:DESKPALS_DATA_DIR | Out-Null
            Set-Content "$env:DESKPALS_DATA_DIR\profile.txt" "done" -NoNewline
            Set-Content "$env:DESKPALS_DATA_DIR\mode.txt" "shelf" -NoNewline
            Set-Content "$env:DESKPALS_DATA_DIR\lineup.txt" $v.lu -NoNewline
            $ps1 = (Resolve-Path $v.ps1).Path
            $pipe = "desk-pals-shelf-" + $v.n
            Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$ps1`" -PipeName $pipe -Pet $($v.pet) -Lineup $($v.lu)"
            node .github/ping.js $pipe
            if ($LASTEXITCODE -ne 0) { throw ("desktop did not start (shelf " + $v.n + ")") }
            New-Item -ItemType Directory -Force $v.out | Out-Null
            $env:SHELF_LINEUP = $v.lu
            node test/desktop-shelf.js $pipe (Resolve-Path $v.out).Path
            if ($LASTEXITCODE -ne 0) { throw ("shelf test failed (" + $v.n + ")") }
          }
      # 窩伴小世界（翻翻・破破・綿綿）：設定第一頁（公開版兩櫃二選一；個人版另外有三櫃）、三隻 16 張動作圖、串場、換櫃、書包小屋、搗蛋（破破）
      - name: Woban test (setup first page public + personal, pals, 書包小屋, mischief; desk-pals.ps1)
        shell: powershell
        run: |
          $runs = @(
            @{ n = "setup-pub"; ps1 = "build\public\extension\desktop\desk-pals.ps1"; mode = "setup"; per = "0"; fresh = $true; test = "woban" },
            @{ n = "setup-per"; ps1 = "extension\desktop\desk-pals.ps1"; mode = "setup"; per = "1"; fresh = $true; test = "woban" },
            @{ n = "pals-pub"; ps1 = "build\public\extension\desktop\desk-pals.ps1"; mode = "pals"; per = "0"; fresh = $false; test = "woban" },
            @{ n = "shelf-pub"; ps1 = "build\public\extension\desktop\desk-pals.ps1"; mode = ""; per = "0"; fresh = $false; test = "shelf" },
            @{ n = "mis-pub"; ps1 = "build\public\extension\desktop\desk-pals.ps1"; mode = ""; per = "0"; fresh = $false; test = "mischief" })
          foreach ($v in $runs) {
            $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
            $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-woban-" + $v.n
            New-Item -ItemType Directory -Force $env:DESKPALS_DATA_DIR | Out-Null
            $a = "-NoProfile -File `"" + (Resolve-Path $v.ps1).Path + "`" -PipeName desk-pals-woban-" + $v.n
            if (-not $v.fresh) {
              Set-Content "$env:DESKPALS_DATA_DIR\profile.txt" "done" -NoNewline
              Set-Content "$env:DESKPALS_DATA_DIR\mode.txt" "shelf" -NoNewline
              Set-Content "$env:DESKPALS_DATA_DIR\lineup.txt" "woban" -NoNewline
              $a += " -Pet bobo -Lineup woban"
            }
            $pipe = "desk-pals-woban-" + $v.n
            Start-Process powershell.exe -ArgumentList $a
            node .github/ping.js $pipe
            if ($LASTEXITCODE -ne 0) { throw ("desktop did not start (woban " + $v.n + ")") }
            $out = "public-ps1-shots\woban-" + $v.n
            if ($v.per -eq "1") { $out = "ps1-shots\woban-" + $v.n }
            New-Item -ItemType Directory -Force $out | Out-Null
            $env:WOBAN_MODE = $v.mode; $env:WOBAN_PERSONAL = $v.per; $env:SHELF_LINEUP = "woban"; $env:MIS_PET = "bobo"
            if ($v.test -eq "woban") { node test/desktop-woban.js $pipe (Resolve-Path $out).Path "$env:TEMP\desk-pals.log" }
            elseif ($v.test -eq "shelf") { node test/desktop-shelf.js $pipe (Resolve-Path $out).Path }
            else { node test/desktop-mischief.js $pipe (Resolve-Path $out).Path "$env:TEMP\desk-pals.log" }
            if ($LASTEXITCODE -ne 0) { throw ("woban test failed (" + $v.n + ")") }
          }
      # 舊版「Spidey 小夥伴」升級接手（個人版）＋全新安裝不會建出舊名字的東西：都在臨時資料夾，不碰 runner 的 %LOCALAPPDATA%、「啟動」資料夾
      - name: Legacy upgrade takeover (personal) + fresh installs create nothing old (personal, public)
        shell: powershell
        run: |
          $T = "$env:RUNNER_TEMP\lg"
          $ps1 = (Resolve-Path "extension\desktop\desk-pals.ps1").Path
          $pub = (Resolve-Path "build\public\extension\desktop\desk-pals.ps1").Path
          node .github/legacy-upgrade.js upgrade desk-pals-lg-a "$T\SpideyDesktop" "$T\Startup" "$T\data" spidey-pet-lg-a -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $ps1 -PipeName desk-pals-lg-a
          if ($LASTEXITCODE -ne 0) { throw "legacy upgrade test failed" }
          node .github/legacy-upgrade.js fresh desk-pals-lg-b "$T\none-b" "$T\Startup-b" "$T\data-b" spidey-pet-lg-b -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $ps1 -PipeName desk-pals-lg-b
          if ($LASTEXITCODE -ne 0) { throw "fresh install test (personal) failed" }
          node .github/legacy-upgrade.js fresh desk-pals-lg-c "$T\none-c" "$T\Startup-c" "$T\data-c" spidey-pet-lg-c -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File $pub -PipeName desk-pals-lg-c
          if ($LASTEXITCODE -ne 0) { throw "fresh install test (public) failed" }
      # ---------- standalone DeskPals.exe / installer / MSIX ----------
      - name: Tools (Pillow, Inno Setup)
        shell: powershell
        run: |
          python -m pip install --quiet pillow
          choco install innosetup -y --no-progress | Out-Null
          Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
      - name: Build public DeskPals.exe, installer, MSIX (dist) + personal exe, installer (dist-personal)
        shell: powershell
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          # 匿名回報（公開版）：tools/variant.py 寫成 pals\ga4.txt 內嵌進 exe；沒設＝這一版不回報
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: |
          if ($env:WINDOWS_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
            $env:DESKPALS_SIGN_PFX = $pfx; $env:DESKPALS_SIGN_PASSWORD = $env:WINDOWS_SIGN_PASSWORD
          } else { "no code-signing secret: unsigned build" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Strict
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 (public) failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Variant personal -OutDir dist-personal -Strict
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 (personal) failed" }
          if ($pfx) { Remove-Item $pfx }
          Get-ChildItem dist, dist-personal | Format-Table Directory, Name, Length
      # vsix 要在 exe 編好之後才打：通用版（Mac 用，不帶 exe）＋ Windows 專用版（TargetPlatform win32-x64／arm64，附剛編好的 DeskPals.exe：
      # 公開版附公開版的 exe、個人版附個人版的；擴充套件直接執行它，不再用 PowerShell 即時編譯）
      - name: Build vsix (universal + win32 with the bundled DeskPals.exe; public → dist, personal → dist-personal)
        env:
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: |
          python -I build_vsix.py --public
          python -I build_vsix.py --public --target win32-x64,win32-arm64 --exe dist/DeskPals.exe
          python -I build_vsix.py --personal --out dist-personal
          python -I build_vsix.py --personal --target win32-x64 --exe dist-personal/DeskPals-personal.exe --out dist-personal
      - name: Fan-content guard on everything that gets published (dist)
        run: |
          python -I tools/variant.py guard dist build/win/DeskPals.all.cs build/win/msix
          python -c "import glob,sys; bad=[f for f in glob.glob('dist/*') if 'personal' in f]; print('personal files in dist:', bad); sys.exit(1 if bad else 0)"
      # 擴充套件從 Windows 專用的 vsix 啟動：跑的是附上的 exe（放到 %LOCALAPPDATA%\DeskPals\app），不是 powershell.exe。
      # 假的 vscode 模組＋離屏；LOCALAPPDATA／APPDATA／TEMP 都換成臨時資料夾。PowerShell 版升級上來（舊的開著、舊的開機捷徑）、
      # exe 改版時舊 exe 還開著（檔案鎖住）、同一版再開、vsix 沒附 exe 時退回 desk-pals.ps1
      - name: Extension from the win32 vsix runs the bundled DeskPals.exe, not PowerShell (public + personal)
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($v in @(@{ n = "pub"; vsix = "dist\desk-pals-*-win32-x64.vsix" }, @{ n = "per"; vsix = "dist-personal\desk-pals-*-win32-x64-personal.vsix" })) {
            $d = "$env:RUNNER_TEMP\vsix-" + $v.n
            [IO.Compression.ZipFile]::ExtractToDirectory((Get-ChildItem $v.vsix).FullName, $d)
            node test/ext-exe.js "$d\extension" ("$env:RUNNER_TEMP\ext-exe-" + $v.n) ("desk-pals-extexe-" + $v.n)
            if ($LASTEXITCODE -ne 0) { throw ("ext-exe test failed (" + $v.n + ")") }
          }
      - name: Smoke-test public DeskPals.exe (offscreen) + study tools + share GIF
        shell: powershell
        run: |
          tzutil /s "Taipei Standard Time"   # test/desktop-study.js fixtures are written in Taipei time
          $env:DESKPALS_OFFSCREEN = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-exe"
          New-Item -ItemType Directory -Force exe-shots | Out-Null
          $a = Start-Process dist\DeskPals.exe -ArgumentList "--pipe desk-pals-ci" -PassThru
          Start-Sleep -Seconds 5
          $env:SMOKE_ORIGINAL = "1"; $env:GITHUB_WORKSPACE = (Resolve-Path exe-shots).Path
          node .github/smoke.js
          Start-Sleep -Seconds 3
          if (-not (Test-Path exe-shots\shot-original.png)) { throw "no snapshot" }
          if (-not $a.HasExited) { throw "exe did not quit" }
          if ((Get-Content "$env:DESKPALS_DATA_DIR\lineup.txt") -ne "original") { throw "fresh install did not start in original" }
          $env:DESKPALS_ISOLATED = "1"
          $b = Start-Process dist\DeskPals.exe -ArgumentList "--pipe desk-pals-studytest" -PassThru
          node .github/ping.js desk-pals-studytest
          node .github/share-check.js desk-pals-studytest $env:DESKPALS_DATA_DIR
          if ($LASTEXITCODE -ne 0) { throw "share GIF failed" }
          $env:STUDY_PET = "duoduo"
          node test/desktop-study.js desk-pals-studytest exe-shots
          if ($LASTEXITCODE -ne 0) { throw "desktop-study failed" }
          Start-Process dist\DeskPals.exe -ArgumentList "--pipe desk-pals-studytest --quit" -Wait
          if (-not $b.HasExited) { throw "--quit did not close it" }
          $log = Get-Content "$env:TEMP\desk-pals.log" -Encoding UTF8
          $log | Select-Object -Last 30
          if (-not ($log | Select-String "exe .* STA")) { throw "exe main thread is not STA (clipboard would fail)" }
      # 工作來源（DeskPals.Work.cs）：假的 Jira／天氣／行事曆（本機 HTTP）、假的 glab／gh（test/fixtures/fake-cli.js）、假的 Claude／Codex 對話；
      # 全部預設關、DPAPI、小本子紀錄格式、不重複通知、設定重開還在、改名 WoWo Pals。不連網路；有時間的都用假時鐘
      - name: Work sources test on DeskPals.exe (public + personal; fake endpoints and CLIs, no network)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force exe-shots\work | Out-Null
          node test/desktop-work.js desk-pals-work "$env:RUNNER_TEMP\dpw-pub" exe-shots\work -- dist\DeskPals.exe --pipe "{ep}"
          if ($LASTEXITCODE -ne 0) { throw "work sources test failed (public)" }
          node test/desktop-work.js desk-pals-workp "$env:RUNNER_TEMP\dpw-per" "$env:RUNNER_TEMP\dpw-per-shots" -- dist-personal\DeskPals-personal.exe --pipe "{ep}"
          if ($LASTEXITCODE -ne 0) { throw "work sources test failed (personal)" }
          # 工作設定視窗（D 版）：格子／清單、按開先跳去填、儲存標紅、Esc 一層一層退、記住怎麼看、150%、螢幕太矮會捲
          New-Item -ItemType Directory -Force exe-shots\work-settings | Out-Null
          node test/desktop-worksettings.js desk-pals-ws "$env:RUNNER_TEMP\dpws-pub" exe-shots\work-settings -- dist\DeskPals.exe --pipe "{ep}" --pet duoduo --lineup original
          if ($LASTEXITCODE -ne 0) { throw "work settings test failed (public)" }
          node test/desktop-worksettings.js desk-pals-wsp "$env:RUNNER_TEMP\dpws-per" "$env:RUNNER_TEMP\dpws-per-shots" -- dist-personal\DeskPals-personal.exe --pipe "{ep}" --pet duoduo --lineup original
          if ($LASTEXITCODE -ne 0) { throw "work settings test failed (personal)" }
      # exe 旁邊沒有 pals 資料夾：紙箱櫃的圖要從內嵌的資源讀
      - name: Shelf test on public DeskPals.exe (shelf art from embedded resources)
        shell: powershell
        run: |
          $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-exe-shelf"
          New-Item -ItemType Directory -Force $env:DESKPALS_DATA_DIR, exe-shots\shelf | Out-Null
          Set-Content "$env:DESKPALS_DATA_DIR\profile.txt" "done" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\mode.txt" "shelf" -NoNewline
          Set-Content "$env:DESKPALS_DATA_DIR\lineup.txt" "original" -NoNewline
          Start-Process dist\DeskPals.exe -ArgumentList "--pipe desk-pals-exeshelf --pet duoduo --lineup original"
          node .github/ping.js desk-pals-exeshelf
          if ($LASTEXITCODE -ne 0) { throw "exe did not start (shelf)" }
          $env:SHELF_LINEUP = "original"
          node test/desktop-shelf.js desk-pals-exeshelf (Resolve-Path exe-shots\shelf).Path
          if ($LASTEXITCODE -ne 0) { throw "shelf test failed (exe)" }
      # 窩伴小世界跑在 exe 上（vsix 附的就是這支）：lineups.txt、woban.txt、動作圖、書包小屋都要從內嵌的資源讀到（exe 旁邊沒有 pals）
      - name: Woban test on DeskPals.exe (setup first page, pals, 書包小屋; embedded resources)
        shell: powershell
        run: |
          $runs = @(
            @{ n = "setup-pub"; exe = "dist\DeskPals.exe"; mode = "setup"; per = "0"; fresh = $true; test = "woban"; out = "exe-shots\woban-setup" },
            @{ n = "pals-pub"; exe = "dist\DeskPals.exe"; mode = "pals"; per = "0"; fresh = $false; test = "woban"; out = "exe-shots\woban-pals" },
            @{ n = "shelf-pub"; exe = "dist\DeskPals.exe"; mode = ""; per = "0"; fresh = $false; test = "shelf"; out = "exe-shots\woban-shelf" },
            @{ n = "pals-per"; exe = "dist-personal\DeskPals-personal.exe"; mode = "pals"; per = "1"; fresh = $false; test = "woban"; out = "personal-exe-shots\woban-pals" })
          foreach ($v in $runs) {
            $env:DESKPALS_OFFSCREEN = "1"; $env:DESKPALS_ISOLATED = "1"
            $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-exe-woban-" + $v.n
            New-Item -ItemType Directory -Force $env:DESKPALS_DATA_DIR, $v.out | Out-Null
            $pipe = "desk-pals-exewoban-" + $v.n
            $a = "--pipe $pipe"
            if (-not $v.fresh) {
              Set-Content "$env:DESKPALS_DATA_DIR\profile.txt" "done" -NoNewline
              Set-Content "$env:DESKPALS_DATA_DIR\mode.txt" "shelf" -NoNewline
              Set-Content "$env:DESKPALS_DATA_DIR\lineup.txt" "woban" -NoNewline
              $a += " --pet bobo --lineup woban"
            }
            $p = Start-Process $v.exe -ArgumentList $a -PassThru
            node .github/ping.js $pipe
            if ($LASTEXITCODE -ne 0) { throw ("exe did not start (woban " + $v.n + ")") }
            $env:WOBAN_MODE = $v.mode; $env:WOBAN_PERSONAL = $v.per; $env:SHELF_LINEUP = "woban"
            if ($v.test -eq "woban") { node test/desktop-woban.js $pipe (Resolve-Path $v.out).Path "$env:TEMP\desk-pals.log" }
            else { node test/desktop-shelf.js $pipe (Resolve-Path $v.out).Path }
            if ($LASTEXITCODE -ne 0) { throw ("woban test failed on the exe (" + $v.n + ")") }
            if (-not $p.WaitForExit(15000)) { throw ("exe did not quit (woban " + $v.n + ")") }
          }
          $miss = Get-Content "$env:TEMP\desk-pals.log" -Encoding UTF8 | Select-String "lineups.txt missing|art missing"
          if ($miss) { $miss; throw "exe could not read embedded art" }
      # 公開版 exe：platform＝win-exe；DESKPALS_FAKE_PACKAGED 假裝是 Store 版，看第一次設定第二頁的「開機時自動出現」
      - name: Store readiness on DeskPals.exe (platform win-exe, Store setup page 2)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force exe-shots\store | Out-Null
          $exe = (Resolve-Path dist\DeskPals.exe).Path
          $env:STORE_FAKE_PACKAGED = "1"
          node test/desktop-store.js desk-pals-store-exe "$env:RUNNER_TEMP\dps-exe" exe-shots\store public win-exe -- $exe --pipe "{ep}"
          if ($LASTEXITCODE -ne 0) { throw "store test failed (exe)" }
      # 小本子（待辦／今天做了／筆記）：假的 log、學校 ICS、假時鐘（study-clock），跟現在幾點、時區無關。剪貼簿不碰真的（nb-clip）
      - name: Notebook test on DeskPals.exe (public + personal; copy text, merge, todos, school, notes, spread, empty states)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force exe-shots\notebook | Out-Null
          $pub = (Resolve-Path dist\DeskPals.exe).Path
          node test/desktop-notebook.js desk-pals-nb "$env:RUNNER_TEMP\dp-nb-pub" exe-shots\notebook -- $pub --pipe "{ep}" --pet duoduo --lineup original
          if ($LASTEXITCODE -ne 0) { throw "notebook test failed (public exe)" }
          $per = (Resolve-Path dist-personal\DeskPals-personal.exe).Path
          $env:NB_SHOTS = "0"
          node test/desktop-notebook.js desk-pals-nbp "$env:RUNNER_TEMP\dp-nb-per" "$env:RUNNER_TEMP\dp-nb-per-shots" -- $per --pipe "{ep}" --pet duoduo --lineup original
          if ($LASTEXITCODE -ne 0) { throw "notebook test failed (personal exe)" }
      - name: Smoke-test personal DeskPals-personal.exe (offscreen, all lineups)
        shell: powershell
        run: |
          $env:DESKPALS_OFFSCREEN = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-exe-personal"
          New-Item -ItemType Directory -Force personal-exe-shots | Out-Null
          $a = Start-Process dist-personal\DeskPals-personal.exe -ArgumentList "--pipe desk-pals-ci-personal --pet po" -PassThru
          Start-Sleep -Seconds 5
          $env:SMOKE_ENDPOINT = "\\.\pipe\desk-pals-ci-personal"; $env:GITHUB_WORKSPACE = (Resolve-Path personal-exe-shots).Path
          node .github/smoke.js
          Start-Sleep -Seconds 3
          if (-not (Test-Path personal-exe-shots\shot-teletubbies.png)) { throw "no snapshot" }
          if (-not $a.HasExited) { throw "exe did not quit" }
      - name: Installer end-to-end (install over the extension's copy, upgrade from 0.10.4 with the rename, uninstall)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem dist\DeskPals-Setup-*.exe).FullName
          # 0.11 改名：先真的裝 0.10.4（舊名字的捷徑），再升級（拿不到就只測擴充套件留下的舊名字捷徑）
          $old = Join-Path $env:RUNNER_TEMP "old-setup"
          # 沒有 v0.10.4 的 Release 時 gh 會寫 stderr，PowerShell 5.1 會把它當成錯誤：先關掉、只看有沒有拿到檔
          $eap = $ErrorActionPreference; $ErrorActionPreference = "Continue"
          try { & gh release download v0.10.4 --repo $env:GITHUB_REPOSITORY --pattern "DeskPals-Setup-0.10.4.exe" --dir $old 2>&1 | Out-Null } catch { "no v0.10.4 release: " + $_.Exception.Message }
          $ErrorActionPreference = $eap; $global:LASTEXITCODE = 0
          $oldSetup = Join-Path $old "DeskPals-Setup-0.10.4.exe"
          if (-not (Test-Path $oldSetup)) { $oldSetup = "" }
          # 空字串經過 powershell -File 會變成「沒給值」：沒有舊安裝檔就不傳 -OldSetup
          $instArgs = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".github\test-installer.ps1", "-Setup", $setup)
          if ($oldSetup) { $instArgs += @("-OldSetup", $oldSetup) }
          & powershell @instArgs
          if ($LASTEXITCODE -ne 0) { throw "installer test failed" }
      # 上面的安裝程式、獨立版都是真的裝在 runner 上（全新安裝）：不能留下舊名字的資料夾、開機捷徑、紀錄檔
      - name: Real fresh install left nothing with the old name
        shell: powershell
        run: |
          $bad = @()
          if (Test-Path "$env:LOCALAPPDATA\SpideyDesktop") { $bad += "$env:LOCALAPPDATA\SpideyDesktop" }
          $bad += @(Get-ChildItem ([Environment]::GetFolderPath("Startup")) -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "spidey" } | ForEach-Object { $_.FullName })
          $bad += @(Get-ChildItem $env:TEMP -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "spidey" } | ForEach-Object { $_.FullName })
          $bad += @(Get-ChildItem "$env:LOCALAPPDATA\DeskPals" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "spidey" } | ForEach-Object { $_.FullName })
          Get-ChildItem "$env:LOCALAPPDATA\DeskPals" -ErrorAction SilentlyContinue | Format-Table Name, Length
          if ($bad.Count -gt 0) { $bad; throw "a fresh install created something with the old name" }
          "nothing with the old name"
      - name: MSIX installs and runs (test-signed copy; best effort)
        continue-on-error: true
        shell: powershell
        run: |
          $msix = (Get-ChildItem dist\DeskPals-*.msix).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\test-msix.ps1 -Msix $msix
          if ($LASTEXITCODE -ne 0) { throw "msix test failed" }
      # 公開版的測試結果
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-result
          path: |
            public-ps1-shots/*.png
            public-ps1-shots/mischief/*.png
            public-ps1-shots/shelf/*.png
            public-ps1-shots/store/*.png
            exe-shots/*.png
            exe-shots/store/*.png
            exe-shots/shelf/*.png
            exe-shots/woban-*/*.png
            exe-shots/notebook/*.png
      # 個人版的測試結果（含同人角色的截圖）：只給自己看，不會附到 Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-windows-result
          path: |
            ps1-shots/*.png
            ps1-shots/mischief/*.png
            ps1-shots/shelf/*.png
            personal-exe-shots/*.png
            personal-exe-shots/woban-*/*.png
      # 公開版：Release 會附上這些
      - uses: actions/upload-artifact@v4
        with:
          name: desk-pals-windows
          path: |
            dist/DeskPals-Setup-*.exe
            dist/DeskPals-*.msix
            dist/*.vsix
      # 個人版（全部角色，含同人）：只放在這次 build 的 artifact，名字都帶 -personal，不會附到 Release
      - uses: actions/upload-artifact@v4
        with:
          name: personal-build-windows
          path: |
            dist-personal/DeskPals-Setup-*-personal.exe
            dist-personal/*-personal.vsix

  # 只有推 v* tag 才會跑：建 GitHub Release，附上公開版的安裝程式、MSIX、DMG、vsix（個人版只在 personal-* artifact，不會附上）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: desk-pals-*
          merge-multiple: true
      # 只發公開版：檔名不能帶 personal、內容不能有同人字眼（vsix／msix 會打開來掃；exe／dmg 掃得到的字串也掃）
      - name: Fan-content guard on the release files
        run: |
          ls -la out
          if ls out | grep -i personal; then echo "personal build in the release files"; exit 1; fi
          python3 -I tools/variant.py guard out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="$(python3 -c 'import json; print(json.load(open("extension/package.json"))["version"])')"
          if [ "$TAG" != "v$VER" ]; then echo "tag $TAG does not match extension/package.json version $VER"; exit 1; fi
          ls -la out
          cat > notes.md <<EOF
          ## WoWo Pals（窩窩公仔櫃）$VER

          把可愛的小公仔放上你的桌面。挑一個下載就好：

          ### 有在用 VS Code（推薦工程師）
          下載 \`desk-pals-$VER-win32-x64.vsix\`（Windows；ARM 電腦用 \`-win32-arm64\`）或 \`desk-pals-$VER.vsix\`（macOS）。
          安裝：VS Code 左邊「延伸模組」→ 右上角「⋯」→「從 VSIX 安裝…」→ 選剛下載的檔案。裝好後公仔會出現在整個螢幕上。
          比桌面版多：Claude／Codex 卡住或做完提醒、推 tag 後盯 CI（GitLab 或公開的 GitHub repo）、Jira 新單、GitLab 待辦、開會和下雨提醒（Ctrl+Shift+P 輸入「公仔櫃」看全部指令）。

          ### 不用 VS Code
          - Windows 10／11：\`DeskPals-Setup-$VER.exe\`。還沒有數位簽章，Windows 跳出「Windows 已保護您的電腦」時按「其他資訊」→「仍要執行」。
          - macOS 13（Ventura）以後：\`DeskPals-$VER.dmg\`（Apple 晶片、Intel 都可以）。第一次打開請看 DMG 裡的說明。

          怎麼用：右鍵點櫃子打開選單；選單「設定 → 使用說明」有完整說明。隱私權政策：https://a96020183.github.io/wowo-pals/privacy.html

          \`DeskPals-$VER.msix\` 是上架 Microsoft Store 用的（未簽章，不能直接安裝），不用下載。

          EOF
          gh release create "$TAG" out/* --title "WoWo Pals $VER" --notes-file notes.md --generate-notes
