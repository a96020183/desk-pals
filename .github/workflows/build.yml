name: build
on: [push, workflow_dispatch]
jobs:
  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: extension/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Compile (same command as spidey-desktop.sh)
        run: |
          set -o pipefail
          xcrun swiftc -O SpideyDesktop.swift -o SpideyDesktop 2>&1 | tee build.log
      - name: Shell syntax
        run: bash -n spidey-desktop.sh
      - name: Smoke run (start, talk over the socket, screenshot, quit)
        run: |
          mkdir -p "$HOME/Library/Application Support/SpideyDesktop"
          SOCK="$HOME/Library/Application Support/SpideyDesktop/spidey.sock"
          ./SpideyDesktop "$SOCK" > run.log 2>&1 &
          PID=$!
          sleep 8
          kill -0 $PID || { echo "died at startup"; cat run.log; exit 1; }
          node -e '
            const net=require("net");const s=net.connect(process.argv[1]);s.setEncoding("utf8");
            s.on("data",d=>process.stdout.write("REPLY "+d));
            s.on("error",e=>{console.log("SOCKET ERR",e.message);process.exit(1)});
            const msgs=["hello","where","act hug","act ball","tag 1.0.0 prod","act nest","claude wait x","act bond","where"];
            let i=0;const t=setInterval(()=>{if(i<msgs.length)s.write(msgs[i++]+"\n");else{clearInterval(t);setTimeout(()=>s.end(),800)}},700);
          ' "$SOCK"
          sleep 2
          screencapture -x shot.png || echo "screencapture failed"
          kill -0 $PID || { echo "died during smoke run"; cat run.log; exit 1; }
          node -e 'const s=require("net").connect(process.argv[1],()=>{s.write("quit\n");setTimeout(()=>process.exit(0),500)})' "$SOCK"
          sleep 2
          if kill -0 $PID 2>/dev/null; then echo "did not quit"; kill $PID; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-result
          path: |
            extension/desktop/build.log
            extension/desktop/run.log
            extension/desktop/shot.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile DeskPals (same as desk-pals.ps1)
        shell: powershell
        run: |
          $src = [System.IO.File]::ReadAllText("extension\desktop\DeskPals.cs", [System.Text.Encoding]::UTF8)
          Add-Type -TypeDefinition $src -ReferencedAssemblies System.Windows.Forms, System.Drawing, System.Web.Extensions -ErrorAction Stop
          "COMPILED OK"
      - name: Smoke run (offscreen, all four pets, snapshot, quit)
        shell: powershell
        run: |
          $env:DESKPALS_OFFSCREEN = "1"
          $env:DESKPALS_DATA_DIR = "$env:RUNNER_TEMP\dp-data"
          $ps1 = (Resolve-Path "extension\desktop\desk-pals.ps1").Path
          Start-Process powershell.exe -ArgumentList "-NoProfile -File `"$ps1`" -PipeName desk-pals-ci -Pet po"
          Start-Sleep -Seconds 12
          node .github/smoke.js
          Start-Sleep -Seconds 3
          if (Test-Path "$env:TEMP\desk-pals.log") { Get-Content "$env:TEMP\desk-pals.log" }
          if (-not (Test-Path shot.png)) { throw "no snapshot" }
      - name: Build vsix
        run: python build_vsix.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-pals-vsix
          path: |
            dist/*.vsix
            shot.png
