<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' {{csp}}; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { min-height:100%; margin:0; }
  body { background:var(--vscode-sideBar-background); color:var(--vscode-sideBar-foreground,var(--vscode-foreground)); font-family:var(--vscode-font-family); font-size:12px; display:flex; flex-direction:column; overflow-x:hidden; overflow-y:auto; user-select:none; }
  .masthead { display:flex; align-items:center; justify-content:space-between; padding:12px 12px 7px; }
  .brand { font-size:15px; font-weight:700; }
  .subbrand { color:var(--vscode-descriptionForeground); font-size:11px; margin-top:2px; }
  #zone { flex:0 0 172px; position:relative; height:172px; min-height:150px; margin:0 10px; border:1px solid var(--vscode-widget-border,#8885); border-radius:12px; overflow:hidden; cursor:crosshair; background:linear-gradient(160deg,#dff4d9,#eff8d8 58%,#f7edcf); }
  body[data-dark="true"] #zone { background:linear-gradient(160deg,#233b35,#30394b 65%,#493c4b); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .bubble { position: absolute; z-index: 2; pointer-events: none; transform: translate(-50%, -100%); background: #FFFFFF; color: #2A2F45; border: 2px solid #2A2F45; border-radius: 8px; padding: 3px 8px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 8px; height: 8px; background: #FFFFFF; border-right: 2px solid #2A2F45; border-bottom: 2px solid #2A2F45; transform: translateX(-50%) rotate(45deg); }
  .bubble.alert { border-color: #C95454; color: #A83232; font-weight: 700; }
  .bubble.alert::after { border-color: #C95454; }
  .bubble.dark { background: #16171F; color: #EEEBF8; border-color: #7B6BC4; }
  .bubble.dark::after { background: #16171F; border-color: #7B6BC4; }
  .bubble.dark.alert { color: #FF8A8A; border-color: #C95454; }
  .bubble.dusk { background: #3B2335; color: #FFEBD9; border-color: #E8935A; }
  .bubble.dusk::after { background: #3B2335; border-color: #E8935A; }
  .bubble.deep { background: #14203A; color: #E4F0FF; border-color: #6FA8E8; }
  .bubble.deep::after { background: #14203A; border-color: #6FA8E8; }
  .bubble.lonely { background: #12303A; color: #E6F6F8; border-color: #5FC3CF; }
  .bubble.lonely::after { background: #12303A; border-color: #5FC3CF; }
  .dashboard { padding:0 10px 12px; }
  .section-title { display:flex; justify-content:space-between; align-items:baseline; margin:12px 2px 7px; font-weight:700; }
  .muted { color:var(--vscode-descriptionForeground); font-size:10px; font-weight:400; }
  .stats,.quick { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .card { border:1px solid var(--vscode-widget-border,#8885); border-radius:9px; padding:9px; background:var(--vscode-editorWidget-background,var(--vscode-sideBar-background)); min-width:0; }
  .card-label,.card-foot { color:var(--vscode-descriptionForeground); font-size:10px; }
  .card-value { font-size:16px; font-weight:700; margin:4px 0 2px; }
  button { font:inherit; cursor:pointer; border-radius:8px; padding:8px 6px; background:var(--vscode-button-secondaryBackground,transparent); color:var(--vscode-button-secondaryForeground,inherit); border:1px solid var(--vscode-widget-border,#8888); }
  button:hover { background:var(--vscode-button-background); color:var(--vscode-button-foreground); }
  button:focus-visible { outline:1px solid var(--vscode-focusBorder); }
  .quick button { text-align:left; min-height:42px; font-weight:600; }
  .quick .primary { background:var(--vscode-button-background); color:var(--vscode-button-foreground); border-color:transparent; }
  .reminder { display:flex; align-items:center; gap:8px; margin-top:7px; }
  .reminder-icon { font-size:18px; }
  .reminder-copy { flex:1; min-width:0; }
  .reminder-copy strong,.reminder-copy span { display:block; }
  .reminder-copy span { margin-top:3px; color:var(--vscode-descriptionForeground); font-size:10px; }
  .btns { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:7px 10px 12px; }
  .btns button { border-radius:7px; padding:5px 2px; font-size:10px; }
   .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:12px; }
  .tabs button { padding:6px; border:0; background:transparent; color:var(--vscode-descriptionForeground); }
  .tabs button[aria-selected="true"] { color:var(--vscode-foreground); font-weight:700; border-bottom:2px solid var(--vscode-focusBorder); border-radius:0; }
  .panel[hidden] { display:none; }
  .toggle-row { display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-bottom:1px solid var(--vscode-widget-border,#8884); }
  input[type="checkbox"] { accent-color:var(--vscode-button-background); }
  select { font:inherit; padding:4px 6px; color:var(--vscode-dropdown-foreground); background:var(--vscode-dropdown-background); border:1px solid var(--vscode-dropdown-border,var(--vscode-widget-border)); border-radius:5px; }
  dialog { width:calc(100% - 48px); max-width:290px; border:1px solid var(--vscode-widget-border,#8888); border-radius:12px; padding:14px; color:var(--vscode-foreground); background:var(--vscode-editor-background); }
  dialog::backdrop { background:#0008; }
  dialog label { display:block; margin:10px 0 5px; color:var(--vscode-descriptionForeground); }
  dialog input { box-sizing:border-box; width:100%; padding:7px; color:var(--vscode-input-foreground); background:var(--vscode-input-background); border:1px solid var(--vscode-input-border,var(--vscode-widget-border)); border-radius:6px; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:6px; margin-top:12px; }
  .chat-messages { display:flex; flex-direction:column; gap:7px; max-height:230px; overflow:auto; padding:4px 1px; }
  .chat-message { max-width:90%; padding:8px 9px; border-radius:10px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
  .chat-message.user { align-self:flex-end; background:var(--vscode-button-secondaryBackground); }
  .chat-message.assistant { align-self:flex-start; background:var(--vscode-editorWidget-background); border:1px solid var(--vscode-widget-border,#8885); }
  .chat-form { display:flex; gap:6px; margin-top:8px; }
  .chat-form textarea { flex:1; min-width:0; resize:vertical; min-height:42px; padding:7px; border:1px solid var(--vscode-input-border,var(--vscode-widget-border)); border-radius:7px; color:var(--vscode-input-foreground); background:var(--vscode-input-background); font:inherit; }
  .chat-note { color:var(--vscode-descriptionForeground); font-size:10px; line-height:1.4; margin-top:8px; }
</style>
</head>
<body>
<div class="masthead"><div><div class="brand">🌱 皮克敏小隊</div><div class="subbrand">陪你顧好今天的生活節奏</div></div><button type="button" data-task="settings" aria-label="開啟設定">⚙</button></div>
<div id="zone"><canvas id="pet"></canvas><div class="bubble" id="bubble" hidden></div></div>
<main class="dashboard"><div class="tabs" role="tablist"><button type="button" role="tab" data-tab="today" aria-selected="true">今日</button><button type="button" role="tab" data-tab="habits" aria-selected="false">習慣</button><button type="button" role="tab" data-tab="chat" aria-selected="false">聊天</button></div>
<section id="today-panel" class="panel"><div class="section-title"><span>今天的狀態</span><span class="muted" id="date-label"></span></div>
<div class="stats"><div class="card"><div class="card-label">電腦使用</div><div class="card-value" id="usage-value">0 分</div><div class="card-foot">此面板開啟時記錄</div></div><div class="card"><div class="card-label">喝水紀錄</div><div class="card-value" id="water-value">0 杯</div><div class="card-foot" id="water-foot">今天，從現在開始記</div></div></div>
<div class="section-title"><span>快速做一件事</span><span class="muted">少點幾下就完成</span></div><div class="quick"><button type="button" class="primary" data-task="focus">🍅 開始專注</button><button type="button" data-task="water">💧 我喝水了</button><button type="button" data-task="remind">＋ 新增提醒</button><button type="button" data-task="ticket">🎫 搶票倒數</button></div>
<div class="section-title"><span>接下來</span><span class="muted">你的提醒</span></div><div id="reminder-list"></div></section>
<section id="habits-panel" class="panel" hidden><div class="section-title"><span>習慣與提醒</span><span class="muted">資料存在本機</span></div>
<label class="toggle-row"><span>記錄此面板開啟時間</span><input id="usage-toggle" type="checkbox" checked></label><label class="toggle-row"><span>喝水提醒</span><input id="water-toggle" type="checkbox" checked></label><label class="toggle-row"><span>喝水間隔</span><select id="water-interval"><option value="30">30 分鐘</option><option value="45">45 分鐘</option><option value="60">60 分鐘</option><option value="90">90 分鐘</option></select></label><label class="toggle-row"><span>專注時間</span><select id="focus-duration"><option value="25">25 分鐘</option><option value="50">50 分鐘</option><option value="90">90 分鐘</option></select></label><div class="toggle-row"><span>休息花休息提醒</span><span class="muted">依 VS Code 休息間隔</span></div>
<div class="card" style="margin-top:10px"><strong>AI 皮克敏</strong><div class="card-foot" style="margin-top:5px">目前是固定陪伴回應；連接 AI 服務可在後續版本設定。</div></div></section>
<section id="chat-panel" class="panel" hidden><div class="section-title"><span>和皮克敏聊聊</span><button type="button" data-task="setup-ai">設定 AI</button></div><div id="chat-messages" class="chat-messages"></div><form id="chat-form" class="chat-form"><textarea id="chat-input" maxlength="1200" rows="2" placeholder="說說今天的課業或心情…"></textarea><button type="submit" aria-label="送出">送出</button></form><div class="chat-note">訊息會送到 OpenAI API 產生回覆，依你的 API 方案計費；請勿輸入密碼或敏感資料。金鑰只保存在 VS Code 安全儲存區。</div></section></main>
<div class="section-title" style="padding:0 10px;margin-bottom:0"><span>和小隊互動</span><span class="muted">點角色也能摸摸牠</span></div>
<div class="btns" id="pet-actions"><button type="button" data-act="hi">打招呼</button><button type="button" data-act="swing">擺盪</button><button type="button" data-act="hang">倒吊</button><button type="button" data-act="sleep">睡覺</button></div>
<dialog id="reminder-dialog"><form method="dialog" id="reminder-form"><strong id="dialog-title">新增提醒</strong><label for="reminder-name">提醒內容</label><input id="reminder-name" maxlength="60" required placeholder="例如：交作業、音樂祭開賣"><label for="reminder-time">提醒時間</label><input id="reminder-time" type="datetime-local" required><div class="dialog-actions"><button type="button" id="dialog-cancel">取消</button><button type="submit">儲存提醒</button></div></form></dialog>
<script nonce="{{nonce}}">
const vscodeApi = acquireVsCodeApi();
const initialState=vscodeApi.getState()||{};
const todayKey=new Date().toLocaleDateString("sv-SE");
const dayData=initialState.lifeDay===todayKey?(initialState.lifeData||{}):{water:0,lastWater:0,usage:0,reminders:[]};
if(!dayData.startedAt)dayData.startedAt=Date.now();
const saveLife=()=>vscodeApi.setState({...(vscodeApi.getState()||{}),lifeDay:todayKey,lifeData:dayData});
const fmtMins=n=>Math.floor(n/60)+" 小時 "+(n%60)+" 分";
let focusLeft=0,reminderKind="remind";let focusDuration=Number(initialState.focusMinutes)||25;let waterInterval=Number(initialState.waterMinutes)||60;const dialog=document.getElementById("reminder-dialog");
function renderLife(){document.getElementById("date-label").textContent=new Date().toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"});document.getElementById("usage-value").textContent=fmtMins(dayData.usage||0);document.getElementById("water-value").textContent=(dayData.water||0)+" 杯";document.getElementById("water-foot").textContent=dayData.lastWater?"上次記錄 "+new Date(dayData.lastWater).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"}):"今天，從現在開始記";const list=document.getElementById("reminder-list"),upcoming=(dayData.reminders||[]).filter(x=>!x.done).sort((a,b)=>a.at-b.at).slice(0,3);list.replaceChildren();if(!upcoming.length){const c=document.createElement("div");c.className="card reminder";c.textContent="🌼 今天先照顧好自己：新增課業或搶票提醒";list.append(c);}upcoming.forEach(x=>{const c=document.createElement("div");c.className="card reminder";const icon=document.createElement("span");icon.className="reminder-icon";icon.textContent=x.kind==="ticket"?"🎫":"⏰";const copy=document.createElement("div");copy.className="reminder-copy";const title=document.createElement("strong");title.textContent=x.title;const time=document.createElement("span");time.textContent=new Date(x.at).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});copy.append(title,time);c.append(icon,copy);list.append(c);});}
renderLife();
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));document.getElementById("today-panel").hidden=t!=="today";document.getElementById("habits-panel").hidden=t!=="habits";document.getElementById("chat-panel").hidden=t!=="chat";}));
document.querySelectorAll("[data-task]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.task;if(t==="water"){dayData.water=(dayData.water||0)+1;dayData.lastWater=Date.now();saveLife();renderLife();say("噗咿！喝水補充能量了 💧",2.5);return;}if(t==="focus"){focusLeft=focusDuration*60;say("先專心 "+focusDuration+" 分鐘，小隊幫你顧著！🍅",3);b.textContent="⏸ 專注中 "+focusDuration+":00";return;}if(t==="settings"){document.querySelector('[data-tab="habits"]').click();return;}if(t==="setup-ai"){vscodeApi.postMessage({type:"setupAi"});return;}reminderKind=t==="ticket"?"ticket":"remind";document.getElementById("dialog-title").textContent=reminderKind==="ticket"?"新增搶票倒數":"新增生活提醒";document.getElementById("reminder-name").placeholder=reminderKind==="ticket"?"活動名稱，例如：音樂祭":"例如：交作業、上課、吃飯";document.getElementById("reminder-time").value="";dialog.showModal();}));
const chatHistory=Array.isArray(initialState.chatHistory)?initialState.chatHistory.slice(-12):[];let chatPending=false;
function renderChat(){const box=document.getElementById("chat-messages");box.replaceChildren();if(!chatHistory.length){const welcome=document.createElement("div");welcome.className="chat-message assistant";welcome.textContent="嗨，我是你的皮克敏小隊。今天想先聊聊什麼？";box.append(welcome);}chatHistory.forEach(m=>{const row=document.createElement("div");row.className="chat-message "+m.role;row.textContent=m.text;box.append(row);});if(chatPending){const row=document.createElement("div");row.className="chat-message assistant";row.textContent="小隊正在想怎麼陪你…";box.append(row);}box.scrollTop=box.scrollHeight;}
function saveChat(){const state=vscodeApi.getState()||{};vscodeApi.setState({...state,chatHistory:chatHistory.slice(-12)});}
renderChat();
document.getElementById("chat-form").addEventListener("submit",e=>{e.preventDefault();const input=document.getElementById("chat-input"),text=input.value.trim();if(!text||chatPending)return;chatHistory.push({role:"user",text});input.value="";chatPending=true;saveChat();renderChat();vscodeApi.postMessage({type:"chat",history:chatHistory.slice(-8).map(x=>({role:x.role==="assistant"?"assistant":"user",content:x.text}))});});
document.getElementById("dialog-cancel").addEventListener("click",()=>dialog.close());document.getElementById("reminder-form").addEventListener("submit",e=>{e.preventDefault();const title=document.getElementById("reminder-name").value.trim(),at=new Date(document.getElementById("reminder-time").value).getTime();if(!title||!Number.isFinite(at)||at<=Date.now())return;dayData.reminders=dayData.reminders||[];dayData.reminders.push({title,at,kind:reminderKind,done:false});saveLife();renderLife();dialog.close();say((reminderKind==="ticket"?"搶票時間記好了！🎫 ":"好，我會提醒你：")+title,3);});
document.getElementById("usage-toggle").checked=initialState.trackUsage!==false;document.getElementById("water-toggle").checked=initialState.waterEnabled!==false;document.getElementById("water-interval").value=String(waterInterval);document.getElementById("focus-duration").value=String(focusDuration);document.getElementById("usage-toggle").addEventListener("change",e=>{const q=vscodeApi.getState()||{};vscodeApi.setState({...q,trackUsage:e.target.checked});});document.getElementById("water-toggle").addEventListener("change",e=>{const q=vscodeApi.getState()||{};vscodeApi.setState({...q,waterEnabled:e.target.checked});});document.getElementById("water-interval").addEventListener("change",e=>{waterInterval=Number(e.target.value);const q=vscodeApi.getState()||{};vscodeApi.setState({...q,waterMinutes:waterInterval});});document.getElementById("focus-duration").addEventListener("change",e=>{focusDuration=Number(e.target.value);const q=vscodeApi.getState()||{};vscodeApi.setState({...q,focusMinutes:focusDuration});});
setInterval(()=>{const q=vscodeApi.getState()||{};if(q.trackUsage!==false&&document.visibilityState==="visible"){dayData.usage=(dayData.usage||0)+1;saveLife();renderLife();}if(focusLeft>0){focusLeft--;const b=document.querySelector('[data-task="focus"]');b.textContent="⏸ 專注中 "+Math.floor(focusLeft/60)+":"+String(focusLeft%60).padStart(2,"0");if(focusLeft===0){b.textContent="🍅 開始專注";say("專注完成！起來動一動吧 🌼",4,true);}}const now=Date.now();(dayData.reminders||[]).forEach(x=>{if(!x.done&&x.at<=now){x.done=true;saveLife();renderLife();say((x.kind==="ticket"?"🎫 ":"⏰ ")+x.title+(x.kind==="ticket"?" 開始了！":""),5,true);}});if(document.getElementById("water-toggle").checked&&now-(dayData.lastWater||dayData.startedAt)>=waterInterval*60000&&now-(dayData.waterNudgeAt||0)>=waterInterval*60000){dayData.waterNudgeAt=now;saveLife();say("喝口水補充能量吧 💧",4,true);}},60000);
const COL_N = { k:"#2A2F45", r:"#D84A4A", R:"#A83A3A", b:"#3D5FAE", w:"#FFFFFF" };
const COL_D = { k:"#0B0B10", r:"#2C2E3B", R:"#1B1C26", b:"#3E4055", w:"#F6F6FA" };
let COL = COL_N, dark = false;
// 平日 18:00 之後到隔天 06:00 黑化（跟桌面版同一條規則）
function isDarkTime(n) {
  const wd = d => d >= 1 && d <= 5;
  if (n.getHours() >= 18) return wd(n.getDay());
  if (n.getHours() < 6) return wd((n.getDay() + 6) % 7);
  return false;
}
function checkDark(announce) {
  const d = isDarkTime(new Date());
  if (d === dark) return;
  dark = d; COL = d ? COL_D : COL_N; document.body.dataset.dark=String(d);
  if (announce) {
    if (isOther()) say(d ? LINES[charId].night_on : LINES[charId].night_off, 3);
    else say(d ? "……下班時間到了。" : "早安，我又變回來了 ☀", 3, d);
  }
}
const HEAD = ["...kkkkkk...","..krrrrrrk..",".krRrrrrRrk.",".krrrRRrrrk.",".kwwkrrkwwk.",".kwwwkkwwwk.",".krwwrrwwrk.","..krrRRrrk.."];
const SLEEPY = [".krrrrrrrrk.", ".kkkkrrkkkk.", ".krrrrrrrrk."];
const BODY = ["...kkkkkk...","..kbrrrrbk..",".kbbrkkrbbk.",".krbrrrrbrk.","..kbbbbbbk.."];
const ARMS_UP = ["kr.kkkkkk.rk","kbkbrrrrbkbk",".kbbrkkrbbk.","..kbrrrrbk..","..kbbbbbbk.."];
const LEGS_A = ["..kbbkkbbk..","..krrkkrrk..","..kkk..kkk.."];
const LEGS_B = ["..kbbkkbbk..",".krrk..krrk.",".kkk....kkk."];
function frame(o) {
  const head = HEAD.slice();
  if (o.sleep) { head[4] = SLEEPY[0]; head[5] = SLEEPY[1]; head[6] = SLEEPY[2]; }
  const rows = head.concat(o.armsUp ? ARMS_UP : BODY, o.step ? LEGS_B : LEGS_A);
  if (dark) rows[10] = rows[10].slice(0, 5) + "ww" + rows[10].slice(7); // 黑衣白蜘蛛
  return rows;
}
const S = 3;

    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  const rows = frameOther({ moving, step: Math.floor(pet.anim * (charId === "stitch" ? 12 : 6)) % 2 === 1 && moving,
    armsUp: pet.state === "air" || (pet.bt > 0 && pet.state === "idle"), sleep: pet.state === "sleep", happy: pet.happy > 0 });
  const lift = charId === "po" && moving ? 4 * S : 0;
  if (charId === "po" && moving) spriteAny(ART.po.SCOOTER, pet.x, pet.y, pet.dir < 0, colors, dark ? P.halo : "#FFFFFF");
  spriteAny(rows, pet.x, pet.y - lift, pet.dir < 0, colors, dark ? P.halo : "#FFFFFF");
  if (charId === "hangyodon" && (pet.state === "idle" || pet.state === "air")) { // 吐泡泡
    g.strokeStyle = "rgba(150,215,255,0.9)"; g.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) { const p = (pet.anim * 0.5 + i / 3) % 1; g.beginPath(); g.arc(pet.x + SW / 2 + (pet.dir < 0 ? -12 : 12) + Math.sin(p * 9 + i) * 3, pet.y + 20 - p * 40, 1.5 + p * 2.5, 0, 7); g.stroke(); }
  }
}

function draw() {
  const theme = document.body.classList.contains("vscode-dark") || document.body.classList.contains("vscode-high-contrast");
  const city = theme ? "#2A3146" : "#DDE2EE", gnd = theme ? "#222839" : "#D2D8E6", web = dark ? "#7B6BC4" : (theme ? "#C9D1E6" : "#8E97B0"), ink = theme ? "#E9ECF3" : "#2E3550";
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.fillStyle = city;
  let bx = 0, seed = 7;
  while (bx < W) {
    seed = (seed * 9301 + 49297) % 233280; const bw = 20 + (seed % 26);
    seed = (seed * 9301 + 49297) % 233280; const bh = 30 + (seed % Math.max(20, Math.min(90, H * .45)));
    g.fillRect(bx, H - 12 - bh, bw - 3, bh); bx += bw;
  }
  g.fillStyle = gnd; g.fillRect(0, H - 12, W, 12);

  g.strokeStyle = web; g.lineWidth = 1.5;
  if (pet.state === "swing") {
    g.beginPath(); g.moveTo(pet.ax, pet.ay); g.lineTo(pet.x + SW / 2, pet.y + 2); g.stroke();
    g.fillStyle = web; g.beginPath(); g.arc(pet.ax, pet.ay, 3, 0, 7); g.fill();
  }
  if (pet.state === "hang") { g.beginPath(); g.moveTo(pet.ax, 0); g.lineTo(pet.ax, pet.y + 3); g.stroke(); }

  if (isOther()) drawOther();
  if (PIK[charId]) drawMiniFlower();
  else sprite(frame({
    step: pet.state === "walk" && Math.floor(pet.anim * 6) % 2 === 1,
    armsUp: pet.state === "swing" || pet.state === "air" || (pet.bt > 0 && pet.state === "idle"),
    sleep: pet.state === "sleep",
  }), pet.x, pet.y, pet.dir < 0, pet.state === "hang");

  if (pet.sense > 0 && pet.state !== "hang") {
    // 蜘蛛感應：頭兩側的波紋
    g.strokeStyle = "#C95454"; g.lineWidth = 2;
    const cx = pet.x + SW / 2, cy = pet.y + 10, wob = Math.sin(pet.anim * 30) * 1.5;
    for (const s of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        g.beginPath();
        g.moveTo(cx + s * (22 + i * 5 + wob), cy - 10 + i * 6);
        g.lineTo(cx + s * (30 + i * 5 + wob), cy - 16 + i * 8);
        g.stroke();
      }
    }
  }
  if (pet.state === "sleep") {
    g.fillStyle = ink; g.font = "bold 12px monospace";
    for (let i = 0; i < 3; i++) {
      const p = (pet.z * .6 + i / 3) % 1;
      g.globalAlpha = 1 - p; g.fillText("z", pet.x + SW - 4 + p * 16, pet.y + 4 - p * 30);
    }
    g.globalAlpha = 1;
  }
  if (pet.bubble && pet.bt > 0) {
    bubble.hidden = false; bubble.textContent = pet.bubble; bubble.classList.toggle("alert", pet.alert);
    bubble.classList.toggle("dark", dark && charId === "spidey"); bubble.classList.toggle("dusk", dark && (charId === "po" || !!TUBBY[charId]));
    bubble.classList.toggle("deep", dark && (charId === "stitch" || !!PIK[charId])); bubble.classList.toggle("lonely", dark && charId === "hangyodon");
    const bw = bubble.offsetWidth;
    const bxp = Math.min(W - bw / 2 - 4, Math.max(bw / 2 + 4, pet.x + SW / 2));
    const byp = pet.state === "hang" ? pet.y + SH + 34 : pet.y - 8 - (charId === "po" ? 12 : 0);
    bubble.style.left = bxp + "px"; bubble.style.top = Math.max(30, byp) + "px";
  } else bubble.hidden = true;
}

let last = performance.now(), saveT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  if (pet.happy > 0) pet.happy -= dt;
  if (pet.joke > 0) { pet.joke -= dt; if (pet.joke <= 0) say("好笑嗎？好笑嗎？", 1.8); }
  saveT += dt; if (saveT > 5) { saveT = 0; vscodeApi.setState({ ...(vscodeApi.getState() || {}), x: pet.x, char: charId }); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (charId !== "spidey") setChar(charId, false);

zone.addEventListener("pointerdown", e => {
  const r = zone.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top;
  if (x > pet.x - 6 && x < pet.x + SW + 6 && y > pet.y - 6 && y < pet.y + SH + 6) {
    if (pet.state === "sleep") { setState("walk", 2); say(isOther() ? LT("wake") : "嗯？我醒了！", 1.8); return; }
    if (isOther()) {
      const now = performance.now(); pet.clicks = (pet.clicks || []).filter(t => now - t < 1300); pet.clicks.push(now);
      pet.happy = 1.5;
      if (pet.clicks.length >= 3) say(pick(LINES[charId].combo), 1.8);
      else { const l = LT("pats"); say(l, 2.4); if (charId === "hangyodon" && !dark) pet.joke = 2.6; }
      if (pet.state === "walk" || pet.state === "idle") jump(0, pet.clicks.length >= 3 ? -340 : -260);
      return;
    }
    say(T(PATS, PATS_D), 2.4); if (pet.state === "walk" || pet.state === "idle") jump(0, -260);
    return;
  }
  if (isOther()) { if (pet.state === "sleep") setState("walk", 1); grounded(); jump((x - pet.x - SW / 2) / 0.6, charId === "hangyodon" ? -200 : -300); say(LINES[charId].sig, .8); return; }
  if (pet.state === "hang" || pet.state === "sleep") { setState("walk", 1); grounded(); }
  if (y < ground() - 20) { startSwing(x, y); say("Thwip!", .8); }
  else { jump((x - pet.x - SW / 2) / 0.6, -260); say("Thwip!", .8); }
});

function actOther(a) {
  const L = LINES[charId];
  if (a === "hi") { grounded(); setState("idle", 2.4); pet.happy = 2; say(LT("hi"), 2.4); }
  if (a === "swing") { // 招牌：小波騎車、史迪仔搗蛋、人魚漢頓講笑話
    grounded();
    if (charId === "po") { setState("walk", 6); say(L.trick, 1.6); }
    else if (charId === "stitch") { setState("idle", 2); pet.happy = 2; say(L.trick, 1.6); jump(pet.dir * 160, -200); }
    else if (TUBBY[charId] || PIK[charId]) { setState("idle", 2.4); pet.happy = 2; say(L.trick, 2.2); jump(0, charId === "tinky" ? -180 : (charId === "pkyellow" ? -460 : -300)); }
    else { setState("idle", 3); say(pick(L.pats), 2.4); if (!dark) pet.joke = 2.6; }
  }
  if (a === "hang") { grounded(); jump((pet.x + SW / 2 > W / 2 ? -1 : 1) * 160, charId === "hangyodon" ? -260 : (charId === "tinky" ? -300 : -420)); say(L.sig, 1); }
  if (a === "sleep") { pet.z = 0; pet.y = ground(); setState("sleep", 8); say(L.sleep, 1.2); }
}
const BTN_SPIDEY = ["打招呼", "擺盪", "倒吊", "睡覺"];
function setChar(id, announce) {
  if (!(id === "spidey" || ART[id])) return;
  charId = id; [SW, SH] = sizeFor(id);
  pet.x = Math.min(Math.max(2, pet.x), Math.max(2, W - SW - 2)); pet.y = ground(); setState("walk", 2);
  const labels = id === "spidey" ? BTN_SPIDEY : LINES[id].btn;
  document.querySelectorAll("#pet-actions button").forEach((b, i) => { b.textContent = labels[i]; });
  vscodeApi.setState({ ...(vscodeApi.getState() || {}), x: pet.x, char: charId });
  if (announce) act("hi");
}

function act(a) {
  if (isOther()) { actOther(a); return; }
  if (a === "hi") { grounded(); setState("idle", 2.4); say(dark ? "……嗨。下班了嗎？" : "嗨！我是你的 Spidey 👋", 2.4); }
  if (a === "swing") { grounded(); startSwing(pet.x + SW / 2 > W / 2 ? W * .25 : W * .75, 20); say("Thwip!", 1); }
  if (a === "hang") { grounded(); startHang(); say("倒吊看世界～", 2); }
  if (a === "sleep") { pet.z = 0; pet.y = ground(); setState("sleep", 8); say("晚安…", 1.2); }
}
document.querySelectorAll("#pet-actions button").forEach(b => b.addEventListener("click", () => act(b.dataset.act)));

window.addEventListener("message", e => {
  const m = e.data || {};
  if(m.type==="chatReply"){chatPending=false;chatHistory.push({role:"assistant",text:m.text||"噗咿…我剛剛沒聽清楚。"});saveChat();renderChat();return;}
  if(m.type==="chatError"){chatPending=false;chatHistory.push({role:"assistant",text:m.text||"現在連不上 AI，晚點再試試。"});saveChat();renderChat();return;}
  if (m.type === "character") { setChar(m.id, true); return; }
  if (m.type === "flower") { flowerPct = m.pct; return; }
  if (isOther()) {
    if (m.type === "save") { if (pet.state === "sleep") setState("walk", 2); grounded(); say(LT("save"), 2); jump(0, -300); }
    else if (m.type === "errors") {
      if (m.count > m.prev) { if (pet.state === "sleep") setState("walk", 2); say(dark ? LINES[charId].err_d(m.count) : LINES[charId].err(m.count), 3, true); if (pet.state === "walk") setState("idle", 3); }
      else if (m.count === 0) { say(LT("ok"), 2.4); grounded(); pet.happy = 2; jump(0, -300); }
    } else if (m.type === "rest") { if (pet.state === "sleep") setState("walk", 1); grounded(); jump(0, -300); setTimeout(() => { if (isOther()) say(LT("rest"), 7); }, 600); }
    else if (m.type === "idle") { pet.z = 0; grounded(); setState("sleep", 1e9); }
    else if (m.type === "wake") { if (pet.state === "sleep") { setState("walk", 2); say(LT("wake"), 1.8); } }
    else if (m.type === "hi") act("hi");
    return;
  }
  if (m.type === "save") {
    if (pet.state === "sleep") setState("walk", 2);
    grounded(); say(T(SAVE, SAVE_D), 2); jump(0, -300);
  } else if (m.type === "errors") {
    if (m.count > m.prev) {
      if (pet.state === "sleep") setState("walk", 2);
      pet.sense = 2.8; say(dark ? `${m.count} 個錯誤……明天再修，回家。` : `蜘蛛感應！有 ${m.count} 個錯誤`, 3, true);
      if (pet.state === "walk") setState("idle", 3);
    } else if (m.count === 0) {
      say(dark ? "錯誤清完了。那就可以下班了吧。" : "錯誤都清光了，讚！", 2.4); grounded(); jump(0, -300);
    }
  } else if (m.type === "rest") {
    if (pet.state === "sleep") setState("walk", 1);
    grounded(); startSwing(W / 2, 18);
    setTimeout(() => say(dark ? "……喝完可樂就下班。" : "寫很久了，起來喝口可樂、伸展一下！🥤", 7), 600);
  } else if (m.type === "idle") {
    pet.z = 0; grounded(); setState("sleep", 1e9);
  } else if (m.type === "wake") {
    if (pet.state === "sleep") { setState("walk", 2); say(dark ? "……你回來了。是要來關機的吧？" : "你回來啦！", 1.8); }
  } else if (m.type === "hi") act("hi");
});
</script>
